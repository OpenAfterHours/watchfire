[project]
name = "regcite"
version = "0.1.0"
description = "Static analysis for UK financial regulatory citations in Python code."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenAfterHours"}
]
maintainers = [
    {name = "OpenAfterHours"}
]
keywords = [
    "regulation",
    "compliance",
    "pra",
    "crr",
    "basel",
    "citations",
    "static-analysis",
    "audit",
    "banking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0.0",
    "typer>=0.12.0",
]

[project.scripts]
regcite = "regcite.cli:app"

[project.urls]
Homepage = "https://github.com/OpenAfterHours/regcite"
Repository = "https://github.com/OpenAfterHours/regcite.git"
Issues = "https://github.com/OpenAfterHours/regcite/issues"
Changelog = "https://github.com/OpenAfterHours/regcite/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.3.0",
    "ty",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regcite"]
# data/index.parquet is bundled in the wheel via the default hatchling
# package-include behaviour (it lives under src/regcite/).

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"src/regcite/cli.py" = ["T20"]
"src/regcite/checks/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["regcite"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/regcite"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["tests/fixtures/"]

# Project-level defaults consumed by `regcite check` itself.
# Downstream projects that depend on regcite add their own [tool.regcite] table.
[tool.regcite]
rulebook_version = "2024-07-09"
instruments = ["CRR", "PRA_RULEBOOK", "PS", "SS", "DELEGATED_REG"]
source_paths = ["src"]
