site_name: watchfire
site_description: Static analysis for UK financial regulatory citations.
site_url: https://OpenAfterHours.github.io/watchfire/
repo_url: https://github.com/OpenAfterHours/watchfire
repo_name: OpenAfterHours/watchfire

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
